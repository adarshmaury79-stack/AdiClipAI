<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f26">
<title>AdiClipAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f26;--bg2:#1b1738;--card:#221d47;--line:#383070;--ink:#f3f0ff;--mute:#a9a3d1;--yel:#ffe500;--vio:#8b6cff;--bad:#ff7a8a;--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:radial-gradient(120% 60% at 50% -10%,#2b2360 0%,var(--bg) 60%) fixed;color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
main{max-width:620px;margin:0 auto;padding:20px 18px 60px}
body.pre main{opacity:0;transform:translateY(28px) scale(.98)}
main{transition:opacity .9s var(--ease),transform .9s var(--ease)}

/* splash: one-time open animation */
#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;align-content:center;gap:28px;clip-path:inset(0);transition:clip-path .9s var(--ease)}
#splash.out{clip-path:inset(0 0 100% 0)}
#splash .words{display:flex;gap:.2em;font:800 clamp(46px,16vw,92px)/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;text-transform:uppercase}
#splash .words span{opacity:0;transform:translateY(45%) scale(.6) rotate(-4deg);animation:pop .6s var(--ease) forwards;text-shadow:0 4px 0 #000,0 0 28px rgba(139,108,255,.55)}
#splash .words span:nth-child(1){animation-delay:.3s}
#splash .words span:nth-child(2){animation-delay:.62s;color:var(--yel)}
#splash .words span:nth-child(3){animation-delay:.94s}
#splash .tl{width:min(70vw,340px);height:6px;border-radius:9px;background:var(--bg2);position:relative;overflow:hidden;opacity:0;animation:fade .4s .2s forwards}
#splash .tl b{position:absolute;inset:0;border-radius:9px;background:linear-gradient(90deg,var(--vio),var(--yel));transform-origin:left;transform:scaleX(0);animation:fill 1.9s .3s var(--ease) forwards}
#splash small{color:var(--mute);opacity:0;animation:fade .6s 1.3s forwards}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes fill{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}

/* header */
header{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--vio),#5a3df0);display:grid;place-items:center;box-shadow:0 8px 24px rgba(139,108,255,.4)}
header h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
header p{color:var(--mute);font-size:13px}
h2{font-size:clamp(28px,8vw,40px);line-height:1.08;font-weight:800;letter-spacing:-.03em;margin-bottom:10px}
.lead{color:var(--mute);margin-bottom:22px}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;color:var(--mute)}
input,select{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;outline:none;transition:border-color .25s,box-shadow .25s,transform .35s var(--ease)}
input:focus,select:focus{border-color:var(--vio);box-shadow:0 0 0 4px rgba(139,108,255,.22)}
input:focus{transform:translateY(-1px)}
.url{font-size:17px}
#info{min-height:0;color:var(--mute);font-size:14px;padding:0 4px;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s var(--ease),opacity .4s,padding .4s}
#info.show{max-height:70px;opacity:1;padding:8px 4px 0}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.fold.open{grid-template-rows:1fr}
.fold>div{overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 2px 4px}
.grid2 .wide{grid-column:1/-1}

/* buttons and touch motion */
.btn{position:relative;overflow:hidden;border:0;border-radius:16px;padding:15px 20px;font-weight:600;cursor:pointer;background:var(--card);border:1.5px solid var(--line);transition:transform .35s var(--ease),background .25s,box-shadow .35s var(--ease),opacity .25s;will-change:transform;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.95);transition-duration:.12s}
.btn.main{background:var(--yel);color:#17122f;border-color:var(--yel);font-weight:800;font-size:17px;width:100%;box-shadow:0 10px 30px rgba(255,229,0,.22)}
.btn.main:active{box-shadow:0 4px 14px rgba(255,229,0,.2)}
.btn.main .rip{background:rgba(0,0,0,.2)}
.btn.ghost{background:transparent}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.55;pointer-events:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.26);transform:scale(0);animation:rip .7s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--vio);font-weight:600;padding:8px 2px;cursor:pointer;align-self:flex-start;transition:opacity .2s,transform .3s var(--ease)}
.link:active{transform:scale(.94);opacity:.7}
.chip{position:relative;overflow:hidden;border:1.5px solid var(--line);background:var(--bg2);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;transition:background .3s,color .3s,border-color .3s,transform .35s var(--ease)}
.chip:active{transform:scale(.93);transition-duration:.1s}
.chip.on{background:var(--vio);border-color:var(--vio);color:#fff}

/* views */
.view{display:none}
.view.show{display:block;animation:viewin .7s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(22px)}}

/* progress */
.prog{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px}
.bar{height:10px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:16px 0 10px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--vio),var(--yel));transition:width .9s var(--ease);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:shine 1.4s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.stage{font-weight:600}
.pct{color:var(--mute);font-size:14px;display:flex;justify-content:space-between}
.err{color:var(--bad);background:rgba(255,122,138,.1);border:1.5px solid rgba(255,122,138,.35);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px;word-break:break-word}

/* results */
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.rhead p{color:var(--mute);font-size:14px}
.clip{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:12px;margin-bottom:18px;opacity:0;transform:translateY(34px) scale(.97);animation:cardin .8s var(--ease) forwards}
@keyframes cardin{to{opacity:1;transform:none}}
.vid{position:relative;border-radius:16px;overflow:hidden;background:#000;max-height:62vh;display:grid;place-items:center}
.vid video{width:100%;height:100%;max-height:62vh;display:block;object-fit:contain}
.vid .cap{position:absolute;left:8%;right:8%;bottom:14%;text-align:center;font:800 clamp(18px,5.5vw,28px)/1.15 "Bricolage Grotesque",system-ui,sans-serif;color:var(--yel);text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 4px 10px #000;pointer-events:none;transition:opacity .15s}
.vid .play{position:absolute;inset:0;border:0;background:rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer;transition:opacity .4s var(--ease),background .3s}
.vid .play span{width:68px;height:68px;border-radius:50%;background:rgba(255,229,0,.95);display:grid;place-items:center;transition:transform .45s var(--ease);box-shadow:0 8px 28px rgba(0,0,0,.45)}
.vid .play:active span{transform:scale(.88)}
.vid.playing .play{opacity:0}
.vid.playing .play:active{opacity:1}
.seek{height:4px;background:rgba(255,255,255,.15);position:absolute;left:0;right:0;bottom:0}
.seek i{display:block;height:100%;width:0;background:var(--yel)}
.meta{display:flex;align-items:center;gap:12px;margin:14px 4px 6px}
.score{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:conic-gradient(var(--yel) calc(var(--s)*1%),var(--bg2) 0);position:relative}
.score::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.score b{position:relative;font-size:15px}
.meta h3{font-size:18px;line-height:1.25;font-weight:700}
.time{color:var(--mute);font-size:13px}
.desc{color:var(--mute);font-size:14px;margin:6px 4px 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 12px}
.tags span{font-size:13px;color:var(--vio);background:rgba(139,108,255,.14);border-radius:999px;padding:3px 10px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:120px}
.export .opt{padding:14px 4px 4px;display:flex;flex-direction:column;gap:12px}
.export .chips{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--mute);cursor:pointer}
.sw input{display:none}
.sw u{width:48px;height:28px;border-radius:99px;background:var(--bg2);border:1.5px solid var(--line);position:relative;transition:background .3s;text-decoration:none}
.sw u::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .45s var(--ease)}
.sw input:checked+u{background:var(--vio);border-color:var(--vio)}
.sw input:checked+u::after{transform:translateX(20px)}
.btn.busy{pointer-events:none}
.btn.busy::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transform:translateX(-100%);animation:shine 1.1s infinite}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#fff;color:#17122f;font-weight:600;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .35s,transform .5s var(--ease);z-index:50;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}#splash{display:none}}
</style>
</head>
<body class="pre">

<div id="splash" aria-hidden="true">
  <div class="words"><span>Adi</span><span>Clip</span><span>AI</span></div>
  <div class="tl"><b></b></div>
  <small>Viral clips, seconds mein</small>
</div>

<main>
  <header>
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" stroke="#fff" stroke-width="2"/><path d="M10 9l5 3-5 3z" fill="#ffe500"/></svg></div>
    <div><h1>AdiClipAI</h1><p>YouTube se viral shorts</p></div>
  </header>

  <!-- input -->
  <section class="view show" id="vIn">
    <h2>Lamba video do, best clips lo.</h2>
    <p class="lead">YouTube link daalo. AdiClipAI bolne wale best moments dhoondh kar captions ke saath clips banata hai.</p>
    <form class="stack" id="form" autocomplete="off">
      <div class="field">
        <input class="url" id="url" type="url" inputmode="url" placeholder="https://youtube.com/watch?v=..." required>
        <div id="info"></div>
      </div>
      <button type="button" class="link" id="optBtn">Options dikhao</button>
      <div class="fold" id="opts"><div><div class="grid2">
        <div class="field"><label for="start">Start (sec ya mm:ss)</label><input id="start" value="0"></div>
        <div class="field"><label for="end">End (0 = poora video)</label><input id="end" value="0"></div>
        <div class="field"><label for="minlen">Clip min (sec)</label><input id="minlen" type="number" inputmode="numeric" value="30"></div>
        <div class="field"><label for="maxlen">Clip max (sec)</label><input id="maxlen" type="number" inputmode="numeric" value="60"></div>
        <div class="field"><label for="count">Kitne clips (1-10)</label><input id="count" type="number" inputmode="numeric" value="7" min="1" max="10"></div>
        <div class="field"><label for="lang">Bhasha</label><select id="lang"><option value="auto">Auto</option><option value="hi">Hindi</option><option value="en">English</option><option value="ur">Urdu</option><option value="pa">Punjabi</option><option value="bn">Bengali</option><option value="ta">Tamil</option><option value="te">Telugu</option><option value="mr">Marathi</option><option value="gu">Gujarati</option></select></div>
        <div class="field wide"><label for="kw">Keywords (comma se alag)</label><input id="kw" placeholder="paisa, sach, secret"></div>
      </div></div></div>
      <button class="btn main" id="go" type="submit">Clips banao</button>
    </form>
  </section>

  <!-- progress -->
  <section class="view" id="vProg">
    <div class="prog">
      <h2 id="pTitle" style="font-size:22px">Shuru ho raha hai</h2>
      <div class="bar"><i id="pBar"></i></div>
      <div class="pct"><span class="stage" id="pStage">Shuru</span><span id="pPct">0%</span></div>
      <div class="err" id="pErr" hidden></div>
      <button class="btn" id="retry" hidden style="margin-top:16px;width:100%">Dobara try karo</button>
    </div>
  </section>

  <!-- results -->
  <section class="view" id="vRes">
    <div class="rhead"><div><h2 style="font-size:26px;margin-bottom:2px">Clips ready</h2><p id="rSub"></p></div><button class="btn sm" id="again">Naya video</button></div>
    <div id="list"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
const parseT=v=>{v=String(v).trim();if(!v)return 0;if(v.includes(":"))return v.split(":").reduce((a,x)=>a*60+(parseFloat(x)||0),0);return parseFloat(v)||0};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let toastT;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200)};
const show=id=>{document.querySelectorAll(".view").forEach(v=>v.classList.remove("show"));$(id).classList.add("show");window.scrollTo({top:0,behavior:"smooth"})};

/* open animation: plays once per page load */
(function(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const open=()=>{document.body.classList.remove("pre");const s=$("#splash");s.classList.add("out");setTimeout(()=>s.remove(),1000)};
  reduce?open():setTimeout(open,2450);
})();

/* touch ripple on buttons and chips */
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".btn,.chip");if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,i=document.createElement("i");
  i.className="rip";i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(i);setTimeout(()=>i.remove(),750);
},{passive:true});

/* options fold */
$("#optBtn").onclick=()=>{const o=$("#opts");o.classList.toggle("open");$("#optBtn").textContent=o.classList.contains("open")?"Options chhupao":"Options dikhao"};

/* link info preview */
let infoT;
$("#url").addEventListener("input",()=>{
  clearTimeout(infoT);const i=$("#info"),u=$("#url").value.trim();i.classList.remove("show");
  if(!/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(u))return;
  infoT=setTimeout(async()=>{
    try{const r=await fetch("/api/info?url="+encodeURIComponent(u));if(!r.ok)throw 0;const d=await r.json();
      i.textContent=`${d.title||"Video"}${d.duration?" ("+mmss(d.duration)+")":""}`;i.classList.add("show")}catch{}
  },600);
});

/* analyze + poll */
let jobId=null,lastReq=null;
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();
  lastReq={url:$("#url").value.trim(),start:parseT($("#start").value),end:parseT($("#end").value),
    minlen:+$("#minlen").value||30,maxlen:+$("#maxlen").value||60,count:+$("#count").value||7,
    keywords:$("#kw").value,lang:$("#lang").value};
  startJob();
});
$("#retry").onclick=()=>startJob();
async function startJob(){
  setProg(0,"Shuru","Shuru ho raha hai");$("#pErr").hidden=true;$("#retry").hidden=true;show("#vProg");
  try{
    const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(lastReq)});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||"Request fail ho gaya.")}
    jobId=(await r.json()).id;poll(jobId);
  }catch(err){fail(err.message)}
}
function setProg(p,stage,title){$("#pBar").style.width=p+"%";$("#pPct").textContent=p+"%";$("#pStage").textContent=stage;if(title)$("#pTitle").textContent=title}
function fail(m){$("#pErr").textContent=m;$("#pErr").hidden=false;$("#retry").hidden=false}
async function poll(id){
  while(true){
    await sleep(1200);
    try{
      const r=await fetch("/api/job/"+id);if(!r.ok)throw new Error("Job nahi mila. Server restart hua ho sakta hai.");
      const j=await r.json();setProg(j.pct||0,j.stage||"",j.title||"Video process ho raha hai");
      if(j.status==="error")return fail(j.error||"Kuch galat ho gaya.");
      if(j.status==="done"){await sleep(500);return render(id,j)}
    }catch(err){return fail(err.message)}
  }
}

/* results */
function render(id,j){
  $("#rSub").textContent=`${j.title||""} - ${j.clips.length} clips`;
  const list=$("#list");list.innerHTML="";
  j.clips.forEach((c,i)=>{
    const el=document.createElement("article");el.className="clip";el.style.animationDelay=(i*110)+"ms";
    el.innerHTML=`
      <div class="vid" style="aspect-ratio:${j.w||16}/${j.h||9}">
        <video playsinline preload="metadata" src="/media/${id}#t=${c.start},${c.end}"></video>
        <div class="cap"></div>
        <button class="play" aria-label="Play"><span><svg width="26" height="26" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#17122f"/></svg></span></button>
        <div class="seek"><i></i></div>
      </div>
      <div class="meta"><div class="score" style="--s:${c.score}"><b>${c.score}</b></div>
        <div><h3>${esc(c.title)}</h3><div class="time">${mmss(c.start)} - ${mmss(c.end)} (${Math.round(c.end-c.start)} sec)</div></div></div>
      <p class="desc">${esc(c.description)}</p>
      <div class="tags">${(c.tags||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      <div class="actions">
        <button class="btn sm" data-a="exp">Download</button>
        <button class="btn sm ghost" data-a="copy">Copy text</button>
      </div>
      <div class="fold export"><div><div class="opt">
        <div class="chips" data-g="ratio"><span class="chip on" data-v="orig">Original</span><span class="chip" data-v="9:16">9:16</span><span class="chip" data-v="1:1">1:1</span><span class="chip" data-v="4:5">4:5</span><span class="chip" data-v="16:9">16:9</span></div>
        <div class="chips" data-g="q"><span class="chip" data-v="480">480p</span><span class="chip" data-v="720">720p</span><span class="chip" data-v="1080">1080p</span><span class="chip on" data-v="1440">Best</span></div>
        <label class="sw"><span>Captions lagao</span><input type="checkbox" checked><u></u></label>
        <div class="row"><button class="btn main" data-a="vid" style="flex:1">Video download</button><button class="btn" data-a="aud">MP3</button></div>
      </div></div></div>`;
    list.appendChild(el);wire(el,id,i,c);
  });
  show("#vRes");
}
function wire(el,id,i,c){
  const v=el.querySelector("video"),box=el.querySelector(".vid"),cap=el.querySelector(".cap"),seek=el.querySelector(".seek i");
  const ws=(c.words||[]).map(w=>[w[0],w[1],w[2]]),groups=[];
  for(let k=0;k<ws.length;k+=3){const g=ws.slice(k,k+3);groups.push({a:g[0][1],b:ws[k+3]?ws[k+3][1]:g[g.length-1][2]+.3,t:g.map(x=>x[0]).join(" ").toUpperCase()})}
  v.addEventListener("loadedmetadata",()=>{if(v.currentTime<c.start)v.currentTime=c.start});
  v.addEventListener("timeupdate",()=>{
    const t=v.currentTime;
    if(t>=c.end){v.pause();v.currentTime=c.start;return}
    seek.style.width=Math.max(0,Math.min(100,(t-c.start)/(c.end-c.start)*100))+"%";
    const g=groups.find(g=>t>=g.a&&t<g.b);cap.textContent=g?g.t:"";
  });
  v.addEventListener("play",()=>box.classList.add("playing"));
  v.addEventListener("pause",()=>box.classList.remove("playing"));
  box.addEventListener("click",()=>{if(v.paused){if(v.currentTime<c.start||v.currentTime>=c.end)v.currentTime=c.start;v.play()}else v.pause()});
  const sel={ratio:"orig",q:"1440"};
  el.querySelectorAll(".chips").forEach(g=>g.addEventListener("click",e=>{
    const ch=e.target.closest(".chip");if(!ch)return;
    g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));ch.classList.add("on");sel[g.dataset.g]=ch.dataset.v;
  }));
  el.addEventListener("click",async e=>{
    const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
    if(a==="exp"){el.querySelector(".export").classList.toggle("open");return}
    if(a==="copy"){const txt=`${c.title}\n\n${c.description}\n${(c.tags||[]).join(" ")}`;
      try{await navigator.clipboard.writeText(txt);toast("Copy ho gaya")}catch{toast("Copy nahi hua")}return}
    if(a==="aud"){save(`/api/audio/${id}/${i}`);return}
    if(a==="vid"){
      const caps=el.querySelector(".sw input").checked?1:0;
      const qs=`q=${sel.q}&captions=${caps}&ratio=${encodeURIComponent(sel.ratio)}`,base=`/api/clip/${id}/${i}?${qs}`;
      const old=b.textContent;b.classList.add("busy");b.textContent="Render ho raha hai...";
      try{
        while(true){
          const r=await fetch(base+"&prepare=1");if(!r.ok)throw new Error("Render fail ho gaya. Dobara try karo.");
          if((await r.json()).ready)break;await sleep(1500);
        }
        save(base);toast("Download shuru");
      }catch(err){toast(err.message)}
      b.classList.remove("busy");b.textContent=old;
    }
  });
}
function save(u){const a=document.createElement("a");a.href=u;a.download="";document.body.appendChild(a);a.click();a.remove()}
$("#again").onclick=()=>{$("#list").innerHTML="";show("#vIn")};
</script>
</body>
